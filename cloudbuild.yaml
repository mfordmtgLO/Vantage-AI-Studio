# Google Cloud Build CI/CD Configuration
# Automatically builds and deploys to Google Cloud Run on GitHub commits
# Project: vantage-ai-workspace (Region: us-west1 - Oregon)
# Copyright (c) 2026 Mike Ford <fordmj@gmail.com>

steps:
  # Deploy directly to Cloud Run in us-west1 (Oregon) using native source build
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vantage-ai-workspace'
      - '--source'
      - '.'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--remove-annotations=run.googleapis.com/sources,run.googleapis.com/base-images'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'



