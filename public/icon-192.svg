<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="vantage_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkle_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#vantage_grad)" filter="url(#glow)"/>
  
  <!-- Outer glowing ring / shield accent -->
  <circle cx="96" cy="96" r="70" stroke="rgba(255, 255, 255, 0.18)" stroke-width="3" fill="none" />
  
  <!-- Central Stylized V & Sparkle AI Symbol -->
  <path d="M54 62 L96 138 L138 62" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Dynamic Cross AI Node -->
  <path d="M96 44 L96 84 M76 64 L116 64" stroke="url(#sparkle_grad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="96" cy="64" r="5" fill="#ffffff"/>
  
  <!-- Orbiting Plugin Dots (4 Modules) -->
  <circle cx="48" cy="96" r="4.5" fill="#93c5fd"/>
  <circle cx="144" cy="96" r="4.5" fill="#93c5fd"/>
  <circle cx="96" cy="148" r="4.5" fill="#60a5fa"/>
</svg>
