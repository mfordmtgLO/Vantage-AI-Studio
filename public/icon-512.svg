  <circle cx="256" cy="170" r="14" fill="#ffffff"/>

  <!-- Module Satellite Nodes -->
  <circle cx="120" cy="256" r="12" fill="#93c5fd"/>
  <circle cx="392" cy="256" r="12" fill="#93c5fd"/>
  <circle cx="256" cy="400" r="12" fill="#60a5fa"/>
  <circle cx="256" cy="90" r="12" fill="#60a5fa"/>
